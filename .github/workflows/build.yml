name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compila APK di debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FiltroGruppo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Pubblica l'APK tra le Release del repository: si scarica direttamente dal telefono.
      - name: Pubblica l'APK nelle Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FiltroGruppo.apk
          gh release create "build-${{ github.run_number }}" FiltroGruppo.apk \
            --target "${{ github.sha }}" \
            --title "Filtro Gruppo (build ${{ github.run_number }})" \
            --notes "APK di debug compilato automaticamente."
